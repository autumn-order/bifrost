[package]
name = "bifrost"
version = "0.1.0-alpha.4"
edition = "2021"
description = "Authentication platform for EVE Online corporations, alliances, and coalitions"
repository = "https://github.com/autumn-order/bifrost"

[workspace]
members = [".", "bifrost-test-utils", "entity", "migration"]

[workspace.dependencies]
base64 = "0.22.1"
chrono = "0.4.43"
entity = { path = "entity" }
eve_esi = { git = "https://github.com/autumn-order/eve_esi" }
jsonwebtoken = "9.3.1"
mockito = "1.7.0"
oauth2 = "5.0.0"
openssl = "0.10.74"
sea-orm = { version = "2.0.0-rc.11" }
serde_json = "1.0.145"
thiserror = { version = "2.0.17" }
tower-sessions = { version = "0.14.0" }

[dependencies]
axum = "0.8.6"
chrono = { workspace = true, features = ["serde"] }
dotenvy = "0.15.7"
entity = { workspace = true }
eve_esi = { workspace = true }
fred = { version = "10.1.0", features = ["i-scripts"] }
futures = "0.3"
log = "0.4.33"
migration = { path = "migration" }
oauth2 = "5.0.0"
rand = "0.9.2"
sea-orm = { workspace = true, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono"
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = "0.3.44"
tokio = { version = "1.48.0", features = ["macros"] }
tokio-cron-scheduler = "0.15.1"
tower = "0.5.2"
tower-sessions = { workspace = true }
tower-sessions-redis-store = "0.16.0"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
bifrost-test-utils = { path = "bifrost-test-utils" }

[features]
redis-test = []
